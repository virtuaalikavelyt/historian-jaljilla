const map=L.map('map').setView([61.0594,28.1775],17);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri'}).addTo(map);

const modal=document.getElementById('modal'),box=document.getElementById('box'),bg=document.getElementById('bg'),av=document.getElementById('av'),audio=document.getElementById('audio');
 function updateFsButtons(){const expanded=!!document.fullscreenElement||modal.classList.contains('expanded');document.getElementById('fsbtn').textContent=expanded?'⛶ Poistu koko näytöstä':'⛶ Koko näyttö';document.getElementById('fsmodal').textContent=expanded?'⤢':'⛶'}
 function toggleFullscreen(){

   modal.classList.remove('expanded');
   if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});

 const dualvideo=document.getElementById('dualvideo'),dualcanvas=document.getElementById('dualcanvas');
 let dualRenderId=null, dualRenderer=null, mediaAttempt=0;

 function togglePause(){paused=!paused;window.laraPaused=paused;[bg,av,dualvideo,audio].forEach(v=>{if(paused){if(!v.paused){v.dataset.wasplaying='1';v.pause()}else v.dataset.wasplaying='0'}else if(v.dataset.wasplaying==='1'){v.play().catch(()=>{});v.dataset.wasplaying='0'}});if(!paused&&dualvideo.dataset.wasplaying==='0'&&dualvideo.src&&dualvideo.readyState>=2&&dualRenderId!==null){cancelAnimationFrame(dualRenderId);dualRenderId=null;dualFrame()}if(!paused&&pendingNext){const action=pendingNext;pendingNext=false;if(action==='advance')go(idx+1,false);else next()}updatePauseButtons()}
 function routeSegment(from,to){if(route.length<2)return [[from.lat,from.lng],[to.lat,to.lng]];let nearest=(pos)=>{let best=0,dist=Infinity;route.forEach((v,i)=>{let d=(v[0]-pos.lat)**2+(v[1]-pos.lng)**2;if(d<dist){dist=d;best=i}});return best};let a=nearest(from),b=nearest(to);let part=a<=b?route.slice(a,b+1):route.slice(b,a+1).reverse();return [[from.lat,from.lng],...part,[to.lat,to.lng]]}
 function animateRoute(from,to,done){window.laraWalking=true;const path=routeSegment(from,to),lengths=[0];for(let k=1;k<path.length;k++){const a=path[k-1],b=path[k];const dx=(b[1]-a[1])*Math.cos(a[0]*Math.PI/180),dy=b[0]-a[0];lengths.push(lengths.at(-1)+Math.hypot(dx,dy))}const total=lengths.at(-1)||1;let elapsed=0,last=null;function frame(now){if(last===null)last=now;const delta=now-last;last=now;if(!paused)elapsed+=delta;const d=Math.min(elapsed/Math.max(3500,path.length*80),1)*total;let k=1;while(k<lengths.length-1&&lengths[k]<d)k++;const portion=(d-lengths[k-1])/Math.max(lengths[k]-lengths[k-1],1e-12),a=path[k-1],b=path[k];marker.setLatLng([a[0]+(b[0]-a[0])*portion,a[1]+(b[1]-a[1])*portion]);if(!paused && (!window.lastLaraMapFollow || now-window.lastLaraMapFollow>120)){map.panTo(marker.getLatLng(),{animate:false});window.lastLaraMapFollow=now;}if(d<total)anim=requestAnimationFrame(frame);else{anim=null;window.laraWalking=false;done()}}anim=requestAnimationFrame(frame)}
const preloadKeep=new Map();
function preloadMedia(src){
 if(!src||preloadKeep.has(src))return;
 if(/.(jpg|jpeg|png|webp)$/i.test(src)){
  const im=new Image();im.src=src;preloadKeep.set(src,im);
 }else if(/.(mp4|webm)$/i.test(src)){
  const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;v.src=src;v.load();preloadKeep.set(src,v);
 }else if(/.mp3$/i.test(src)){
  const a=new Audio();a.preload='auto';a.src=src;a.load();preloadKeep.set(src,a);
 }
}
function preloadPoint(p){if(!p)return;[p.kuva,p.dual||p.video,p.audio].forEach(preloadMedia)}
function go(i,direct){if(paused)return;if(anim){cancelAnimationFrame(anim);anim=null;}window.laraWalking=false;stopMedia();idx=i;const p=pts[i];preloadPoint(p);preloadPoint(pts[i+1]);const from=marker.getLatLng(),to=L.latLng(p.lat,p.lng);if(direct){marker.setLatLng(to);map.flyTo(to,18,{duration:1.2});activate(p)}else{animateRoute(from,to,()=>{map.flyTo(to,18,{duration:1});activate(p)})}}
window.addEventListener('load',()=>{preloadPoint(pts[0]);preloadPoint(pts[1])});
 function createDualRenderer(){

  if(!gl)throw new Error('WebGL ei ole käytettävissä');
  const vs='attribute vec2 p; varying vec2 uv; void main(){gl_Position=vec4(p,0.,1.);uv=(p+1.)*.5;}';
  const fs='precision mediump float; varying vec2 uv; uniform sampler2D tex; void main(){vec2 xy=vec2(uv.x*.5,1.-uv.y);vec3 rgb=texture2D(tex,xy).rgb;vec3 mask=texture2D(tex,vec2(xy.x+.5,xy.y)).rgb;float a=dot(mask,vec3(.299,.587,.114));a=smoothstep(0.08,0.92,a);float spill=max(0.0,rgb.g-max(rgb.r,rgb.b));float edge=1.0-smoothstep(0.75,1.0,a);float strength=max(edge,0.85*step(0.10,spill));rgb.g-=spill*strength;gl_FragColor=vec4(rgb,a);}';
  function shader(type,source){const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh}
  const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  return ()=>{if(dualvideo.readyState>=2){gl.clear(gl.COLOR_BUFFER_BIT);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,dualvideo);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}};
 }
 function dualFrame(){

  try{dualRenderer();dualRenderId=requestAnimationFrame(dualFrame)}
  catch(err){console.error('Lara-kaksoiskuvan piirto epäonnistui',err);dualvideo.pause();playWebmFallback(pts[idx],mediaAttempt)}
 }
 function playWebmFallback(p,attempt){
  if(attempt!==mediaAttempt)return;
  if(dualRenderId!==null){cancelAnimationFrame(dualRenderId);dualRenderId=null}
  dualvideo.pause();dualcanvas.style.display='none';
  if(p.video){
   av.src=p.video;av.style.display='block';av.onended=()=>{if(attempt===mediaAttempt)next()};
   av.onerror=()=>{if(attempt===mediaAttempt)playAudioFallback(p,attempt)};
   av.play().catch(()=>playAudioFallback(p,attempt));
  }else playAudioFallback(p,attempt);
 }
 function playAudioFallback(p,attempt){
  if(attempt!==mediaAttempt)return;
  av.pause();av.style.display='none';
  // Pelkkä 3D-ratsukko: ei automaattista 3 sekunnin lopetusta.
  if(p.horse && !p.video && !p.dual && !p.audio)return;
  if(p.audio){audio.src=p.audio;audio.onended=()=>{if(attempt===mediaAttempt)next()};audio.onerror=()=>{if(attempt===mediaAttempt)next()};audio.play().catch(()=>{if(attempt===mediaAttempt)next()})}
  else timer=setTimeout(()=>{if(attempt===mediaAttempt)next()},3000);
 }
  // Viipurinportin soihtujen animaatio hyväksytyn 1648x928-taustakuvan päällä.
  const fireCanvas=document.getElementById('firecanvas'),fireCtx=fireCanvas.getContext('2d');
  let fireRaf=0,firePhase=0,fireLast=0;
  function stopFire(){if(fireRaf)cancelAnimationFrame(fireRaf);fireRaf=0;fireLast=0;fireCanvas.style.display='none';fireCtx.clearRect(0,0,fireCanvas.width,fireCanvas.height)}
  function fireTongue(x,y,w,h,dx,alpha,color,offset){
   fireCtx.globalAlpha=alpha;fireCtx.fillStyle=color;fireCtx.beginPath();
   fireCtx.moveTo(x+offset-w/2,y+5);
   fireCtx.bezierCurveTo(x+offset-w,y-h*.30,x+offset+dx-w*.40,y-h*.70,x+offset+dx,y-h);
   fireCtx.bezierCurveTo(x+offset+dx+w*.35,y-h*.66,x+offset+w*.85,y-h*.24,x+offset+w/2,y+5);
   fireCtx.closePath();fireCtx.fill();
  }
  function fireFlame(x,y,p,seed){
   const wave=Math.sin(p*8.5+seed)*.5+Math.sin(p*15.7+seed*3)*.3+Math.sin(p*23.1+seed)*.2;
   const sway=Math.sin(p*5.7+seed)*11+Math.sin(p*12.4+seed*2)*5;
   const h=53+wave*19,w=19+wave*5;
   fireCtx.save();fireCtx.globalCompositeOperation='screen';
   const glow=fireCtx.createRadialGradient(x,y-17,3,x,y-17,110);
   glow.addColorStop(0,'rgba(255,174,45,'+(.28+.17*Math.sin(p*9+seed))+')');
   glow.addColorStop(.42,'rgba(255,100,10,.10)');glow.addColorStop(1,'rgba(255,90,10,0)');
   fireCtx.fillStyle=glow;fireCtx.beginPath();fireCtx.arc(x,y-17,110,0,Math.PI*2);fireCtx.fill();
   fireCtx.shadowColor='#ff8a12';fireCtx.shadowBlur=18;
   fireTongue(x,y,w*1.35,h,sway,.85,'#ff7514',0);
   fireTongue(x,y,w*.78,h*.83,sway*.7,.92,'#ffce30',0);
   fireCtx.shadowBlur=8;
   fireTongue(x,y,w*.37,h*.65,sway*.45,.9,'#fff1a0',0);
   fireTongue(x,y,w*.46,h*.62,-sway*.65,.7,'#ff9b12',-9);
   fireTongue(x,y,w*.39,h*.72,sway*.8,.7,'#ffb327',9);
   fireCtx.restore();
  }
  function fireFrame(now){
   if(fireCanvas.style.display==='none'||modal.style.display==='none'){fireRaf=0;return}
   if(!paused){const dt=fireLast?Math.min((now-fireLast)/1000,.05):0;firePhase+=dt}
   fireLast=now;
   const width=box.clientWidth,height=box.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
   const cw=Math.round(width*dpr),ch=Math.round(height*dpr);
   if(fireCanvas.width!==cw||fireCanvas.height!==ch){fireCanvas.width=cw;fireCanvas.height=ch}
   fireCtx.clearRect(0,0,cw,ch);
   // Sama background-size:cover -rajaus kuin taustakuvassa.
   const scale=Math.max(width/1648,height/928),offsetX=(width-1648*scale)/2,offsetY=(height-928*scale)/2;
   fireCtx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offsetX,dpr*offsetY);
   fireFlame(545,414,firePhase,0);fireFlame(895,414,firePhase,1.87);
   fireCtx.setTransform(1,0,0,1,0,0);
   fireRaf=requestAnimationFrame(fireFrame);
  }
  function startFire(){stopFire();firePhase=0;fireCanvas.style.display='block';fireRaf=requestAnimationFrame(fireFrame)}
  // Kaksoiskuvan ilmoitukset: aiemmasta versiosta puuttuneet funktiot.
  function hideDualMessage(){
    const old=document.getElementById('dual-error-message');
    if(old)old.remove();

    const el=document.createElement('div');

    el.style.cssText='position:absolute;top:65px;left:12px;right:12px;z-index:30;background:#7f1d1d;color:white;padding:12px;border-radius:8px;font:14px Arial,sans-serif';
    el.textContent=message;
    box.appendChild(el);
  }

 function activate(p){
  const attempt=++mediaAttempt;
  preloadPoint(pts[idx+1]);t.textContent=p.nimi;d.textContent=p.kuvaus;mt.textContent=p.nimi;md.textContent=p.kuvaus;
  if(window.panelTimer)clearTimeout(window.panelTimer);if(window.panelHideTimer)clearTimeout(window.panelHideTimer);panel.style.display='block';panel.style.opacity=1;window.panelTimer=setTimeout(()=>{panel.style.opacity=0;window.panelHideTimer=setTimeout(()=>panel.style.display='none',1000)},5000);

  if(p.kuva){if(p.kuva.toLowerCase().endsWith('.mp4')){bg.src=p.kuva;bg.style.display='block';bg.play().catch(()=>{})}else box.style.backgroundImage="url('"+p.kuva+"')"}
    modal.style.display='flex';window.dispatchEvent(new CustomEvent('ratsukko-show',{detail:p}));if(p.fire && p.kuva && !p.kuva.toLowerCase().endsWith('.mp4'))startFire();else stopFire();av.style.display='none';av.removeAttribute('src');dualcanvas.style.display='none';
  function startNarration(){
   if(attempt!==mediaAttempt)return;
   if(p.dual){
   try{
    hideDualMessage();
    if(!dualRenderer)dualRenderer=createDualRenderer();
    dualcanvas.style.display='block';dualvideo.crossOrigin='anonymous';dualvideo.src=p.dual;dualvideo.load();
    dualvideo.onended=()=>{if(attempt===mediaAttempt)next()};
    dualvideo.onerror=()=>{console.warn('Kaksoiskuva-MP4 ei latautunut');dualMessage('Laran MP4-video ei latautunut. Tarkista että dual.mp4 on index.html:n kanssa oikeassa kansiossa.');playWebmFallback(p,attempt)};
    dualvideo.play().then(()=>{if(attempt===mediaAttempt){if(dualRenderId!==null)cancelAnimationFrame(dualRenderId);dualRenderId=requestAnimationFrame(dualFrame)}}).catch(err=>{console.warn('Kaksoiskuva-MP4 ei käynnistynyt',err);dualMessage('Laran MP4-videota ei voitu käynnistää: '+err.message);playWebmFallback(p,attempt)});
   }catch(err){console.error(err);playWebmFallback(p,attempt)}
   }else playWebmFallback(p,attempt);
  }
  // Odota ratsukon valmistumista ennen Laran tarinan käynnistämistä.
  // Jos malli ei lataudu, tarina saa silti jatkua.
  if(p.horse&&p.horseGlb&&p.riderGlb){
   const key=p.horseGlb+'|'+p.riderGlb;
   if(window.ratsukkoReadyKey===key){startNarration();}
   else{
    const ready=e=>{if(e.detail===key)finish()};
    const failed=e=>{if(e.detail===key)finish()};
    function finish(){window.removeEventListener('ratsukko-ready',ready);window.removeEventListener('ratsukko-error',failed);startNarration()}
    window.addEventListener('ratsukko-ready',ready);
    window.addEventListener('ratsukko-error',failed);

   }

 }
function next(){
  if(idx===pts.length-1){
   // Lopussa ei suljeta esitysikkunaa: viimeinen tausta pysyy paikallaan.
   const e=document.getElementById('endlink');
   if(e){if(dualRenderId!==null){cancelAnimationFrame(dualRenderId);dualRenderId=null}dualvideo.pause();dualcanvas.style.display='none';av.pause();av.style.display='none';e.style.display='block';return;}
  }
  closeModal();if(auto&&idx+1<pts.length)timer=setTimeout(()=>{if(paused){pendingNext='advance';return}go(idx+1,false)},1200);
 }
function stopMedia(){window.dispatchEvent(new CustomEvent('ratsukko-show',{detail:null}));stopFire();mediaAttempt++;if(dualRenderId!==null){cancelAnimationFrame(dualRenderId);dualRenderId=null}dualvideo.pause();dualvideo.removeAttribute('src');dualvideo.onended=null;dualvideo.onerror=null;dualcanvas.style.display='none';hideDualMessage();audio.pause();audio.removeAttribute('src');av.pause();av.removeAttribute('src');bg.pause();bg.removeAttribute('src');if(timer)clearTimeout(timer)}
