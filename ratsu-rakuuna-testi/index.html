<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratsu ja rakuuna – sovitustesti</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:15px Arial,sans-serif}header{text-align:center;padding:10px}.stage{position:relative;width:min(100vw,1400px);margin:auto;aspect-ratio:1648/928;overflow:hidden;background:#222}.stage>img{width:100%;height:100%;display:block}#horse{position:absolute;left:19%;top:30%;width:16%;height:34%;pointer-events:none}#horse canvas{width:100%!important;height:100%!important;display:block}.controls{max-width:760px;margin:12px auto;padding:8px 15px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}button{padding:9px 14px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer}.controls label{display:flex;align-items:center;gap:6px}input[type=range]{width:105px}#status{color:#d1d5db}small{color:#cbd5e1}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><strong>🐎 Ratsu ja rakuuna – valmis sovitustesti</strong><div><small>Rakuunan paikkaa ja kokoa voi säätää liukusäätimillä. Kierros noin 18 sekuntia.</small></div></header><div class="stage"><img src="museo_ilman_hevosta.jpg" alt="Ratsuväkimuseon tausta"><div id="horse"></div></div><div class="controls"><button id="toggle">⏸ Pysäytä</button><label>Koko <input id="scale" type="range" min="0.5" max="1.35" step="0.01" value="1.23"><output id="scaleV"></output></label><label>Korkeus <input id="up" type="range" min="0.05" max="1.1" step="0.01" value="0.51"><output id="upV"></output></label><label>Eteen/taakse <input id="fore" type="range" min="-0.65" max="0.65" step="0.01" value="0.02"><output id="foreV"></output></label><label>Kääntö <input id="turn" type="range" min="-180" max="180" step="5" value="0"><output id="turnV"></output></label><button id="copy">Kopioi säädöt</button><span id="status">Ladataan…</span></div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const el=document.getElementById('horse'),status=document.getElementById('status');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,3));const light=new THREE.DirectionalLight(0xffe5c2,2.2);light.position.set(3,5,5);scene.add(light);const pivot=new THREE.Group();scene.add(pivot);const riderGroup=new THREE.Group();pivot.add(riderGroup);let spinning=true,horseReady=false,riderReady=false;document.getElementById('toggle').onclick=()=>{spinning=!spinning;document.getElementById('toggle').textContent=spinning?'⏸ Pysäytä':'▶ Jatka'};function update(){const s=+document.getElementById('scale').value,y=+document.getElementById('up').value,z=+document.getElementById('fore').value,deg=+document.getElementById('turn').value;riderGroup.scale.setScalar(s);riderGroup.position.set(0,y,z);riderGroup.rotation.y=deg*Math.PI/180;for(const [id,v] of [['scale',s.toFixed(2)],['up',y.toFixed(2)],['fore',z.toFixed(2)],['turn',deg+'°']])document.getElementById(id+'V').textContent=v}for(const id of ['scale','up','fore','turn'])document.getElementById(id).oninput=update;update();document.getElementById('copy').onclick=()=>{const v=['scale','up','fore','turn'].map(id=>id+'='+document.getElementById(id).value).join(', ');navigator.clipboard?.writeText(v).then(()=>status.textContent='Säädöt kopioitu: '+v).catch(()=>status.textContent=v)};const loader=new GLTFLoader();loader.load('Cavalry_Horse_Model.glb',g=>{const m=g.scene,b=new THREE.Box3().setFromObject(m),center=b.getCenter(new THREE.Vector3());m.position.sub(center);pivot.add(m);horseReady=true;status.textContent=riderReady?'Molemmat ladattu':'Hevonen ladattu, odotetaan rakuunaa…'},undefined,e=>{console.error(e);status.textContent='Hevosen lataus epäonnistui'});loader.load('Rakuuna.glb',g=>{const m=g.scene,b=new THREE.Box3().setFromObject(m),center=b.getCenter(new THREE.Vector3());m.position.sub(center);riderGroup.add(m);riderReady=true;status.textContent=horseReady?'Molemmat ladattu':'Rakuuna ladattu, odotetaan hevosta…'},undefined,e=>{console.error(e);status.textContent='Rakuunan lataus epäonnistui'});camera.position.set(0,.18,5.8);camera.lookAt(0,.18,0);let prev=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.05);prev=now;const w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(spinning&&horseReady&&riderReady)pivot.rotation.y+=dt*Math.PI*2/18;renderer.render(scene,camera)}requestAnimationFrame(frame);</script></body></html>
