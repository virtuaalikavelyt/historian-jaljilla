<script type="module">

     // Poistetaan juuren/lantion paikkasiirtymät (root motion), jotka

     });

     action.paused=true;

   }

   holder.title='Lara 3D – '+(walking?walking.name:'ei animaatiota');
 },undefined,e=>{console.error('GLB-Laran lataus epäonnistui',e);holder.textContent='⚠️ GLB ei latautunut';});
