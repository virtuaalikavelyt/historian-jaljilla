<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ratsuväkimuseo – 3D-ratsun testi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:16px Arial,sans-serif}
header{text-align:center;padding:12px}h1{font-size:19px;margin:0 0 5px}p{margin:4px}
.stage{position:relative;width:min(100vw,1400px);margin:auto;aspect-ratio:1648/928;overflow:hidden;background:#111}
.stage>img{width:100%;height:100%;display:block}
#horse{position:absolute;left:19%;top:30%;width:16%;height:34%;pointer-events:none}
#horse canvas{width:100%!important;height:100%!important;display:block}
.controls{text-align:center;padding:12px}button{padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold}
small{color:#cbd5e1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body>
<header><h1>🐎 Ratsuväkimuseon 3D-ratsu – testi</h1><small>Hevonen pyörii hitaasti vasemman ikkunan edessä. Malli voi latautua hetken (88 Mt).</small></header>
<div class="stage"><img src="museo_ilman_hevosta.jpg" alt="Ratsuväkimuseo iltavalaistuksessa"><div id="horse"></div></div>
<div class="controls"><button id="toggle">⏸ Pysäytä pyöriminen</button> <span id="status">Ladataan hevosta…</span></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const el=document.getElementById('horse'), status=document.getElementById('status');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,100);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
el.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,3));
const light=new THREE.DirectionalLight(0xffe5c2,2.2);light.position.set(3,5,5);scene.add(light);
const pivot=new THREE.Group();scene.add(pivot);
let spinning=true,loaded=false;
document.getElementById('toggle').onclick=()=>{spinning=!spinning;document.getElementById('toggle').textContent=spinning?'⏸ Pysäytä pyöriminen':'▶ Jatka pyörimistä'};
new GLTFLoader().load('Cavalry_Horse_Model.glb',gltf=>{
 const model=gltf.scene;
 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
 const height=Math.max(size.y,.001);
 model.position.sub(center);
 const wrapper=new THREE.Group();wrapper.scale.setScalar(2.2/height);wrapper.add(model);pivot.add(wrapper);
 // Camera fits the widest horizontal dimension even while rotating.
 const diameter=Math.max(size.x,size.z)/height*2.2;
 const distance=Math.max(5.5,diameter*2.1);
 camera.position.set(0,.15,distance);camera.lookAt(0,0,0);
 loaded=true;status.textContent='3D-ratsu ladattu';
},e=>{if(e.total)status.textContent='Ladataan: '+Math.round(e.loaded/e.total*100)+' %'},err=>{console.error(err);status.textContent='GLB ei latautunut. Avaa testi verkkopalvelimella.'});
let prev=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-prev)/1000,.05);prev=now;
 const w=Math.max(1,el.clientWidth),h=Math.max(1,el.clientHeight);
 if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);
 camera.aspect=w/h;camera.updateProjectionMatrix();
 if(spinning&&loaded)pivot.rotation.y+=dt*Math.PI*2/24;
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script></body></html>
