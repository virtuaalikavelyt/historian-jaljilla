<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rakuunamäki</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}#map{height:70vh}.controls{text-align:center;padding:7px;background:#222}button{padding:9px 15px;margin:2px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:bold}.info{padding:9px 13px;background:#333}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:9999;align-items:center;justify-content:center}.box{position:relative;width:90%;max-width:700px;height:75vh;background:#222 center/cover no-repeat;border-radius:12px;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.dualcanvas{position:absolute;left:10px;bottom:15px;height:58%;max-width:44%;width:auto;aspect-ratio:9/16;z-index:5;display:none;pointer-events:none}.avatar{position:absolute;left:10px;bottom:15px;height:58%;max-width:44%;z-index:5;object-fit:contain}.close{position:absolute;right:12px;top:12px;z-index:20;background:#c33;border-radius:50%;width:38px;height:38px}.panel{position:absolute;left:18px;right:18px;bottom:10px;z-index:8;background:rgba(0,0,0,.72);padding:8px 12px;border-radius:8px}.start{position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}.start>div{max-width:620px;background:white;color:#222;padding:22px;border-radius:14px}.runner{width:65px;height:65px;object-fit:contain}.endlink{display:none;position:absolute;right:20px;bottom:24px;z-index:10;padding:12px 18px;background:#7a241f;color:#fff;text-decoration:none;font-weight:bold;border-radius:9px}</style></head><body>
<div class="start" id="start"><div><h2>Tervetuloa virtuaalikävelylle</h2><p>Testi.</p><button onclick="startShow()">▶ Aloita virtuaaliesittely</button></div></div>
<div id="map"></div><div class="controls"><button onclick="startShow()">▶ Katso virtuaaliesittely</button><button onclick="stopAll()">⏹ Pysäytä</button></div><div class="info"><b id="t">Tervetuloa virtuaalikävelylle</b><div id="d">Testi.</div></div>
<div class="modal" id="modal"><div class="box" id="box"><video class="bg" id="bg" autoplay loop muted playsinline></video><button class="close" onclick="closeModal()">✕</button><canvas class="dualcanvas" id="dualcanvas" width="540" height="960"></canvas><video id="dualvideo" playsinline webkit-playsinline preload="auto" style="position:absolute;width:2px;height:2px;opacity:.01;pointer-events:none"></video><video class="avatar" id="av" autoplay controls playsinline></video><div class="panel" id="panel"><b id="mt"></b><div id="md"></div></div></div></div><audio id="audio"></audio>
<script>
const pts=[{"nimi":"päävartio","kuvaus":"putka","lat":61.0599633,"lng":28.1781828,"kuva":"01-tausta-putka.png","video":"01-avatar-paavartio.webm","dual":"01-dual-lara_dual_full.mp4","audio":""},{"nimi":"Kohde 2","kuvaus":"","lat":61.0594,"lng":28.1775,"kuva":"","video":"","dual":"","audio":""},{"nimi":"Kohde 3","kuvaus":"","lat":61.0594,"lng":28.1775,"kuva":"","video":"","dual":"","audio":""},{"nimi":"Kohde 4","kuvaus":"","lat":61.0594,"lng":28.1775,"kuva":"","video":"","dual":"","audio":""}];let idx=0,auto=false,anim=null,timer=null;
const map=L.map('map').setView([61.0594,28.1775],17);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri'}).addTo(map);
const icon=L.divIcon({className:'',html:"<div style=\"font-size:38px\">🚶</div>",iconSize:[65,65],iconAnchor:[32,32]});
const marker=L.marker([pts[0].lat,pts[0].lng],{icon}).addTo(map);pts.forEach((p,i)=>L.marker([p.lat,p.lng]).addTo(map).bindPopup('<b>'+p.nimi+'</b>').on('click',()=>{auto=false;go(i,true)}));
const modal=document.getElementById('modal'),box=document.getElementById('box'),bg=document.getElementById('bg'),av=document.getElementById('av'),audio=document.getElementById('audio');
 const dualvideo=document.getElementById('dualvideo'),dualcanvas=document.getElementById('dualcanvas');
 let dualRenderId=null, dualRenderer=null;
function startShow(){document.getElementById('start').style.display='none';auto=true;go(0,true)}
const preloadKeep=new Map();
function preloadMedia(src){
 if(!src||preloadKeep.has(src))return;
 if(/.(jpg|jpeg|png|webp)$/i.test(src)){
  const im=new Image();im.src=src;preloadKeep.set(src,im);
 }else if(/.(mp4|webm)$/i.test(src)){
  const v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;v.src=src;v.load();preloadKeep.set(src,v);
 }else if(/.mp3$/i.test(src)){
  const a=new Audio();a.preload='auto';a.src=src;a.load();preloadKeep.set(src,a);
 }
}
function preloadPoint(p){if(!p)return;[p.kuva,p.dual||p.video,p.audio].forEach(preloadMedia)}
function go(i,direct){stopMedia();idx=i;const p=pts[i];preloadPoint(p);preloadPoint(pts[i+1]);const from=marker.getLatLng(),to=L.latLng(p.lat,p.lng);if(direct){marker.setLatLng(to);map.flyTo(to,18,{duration:1.2});activate(p)}else{let st=null;function step(now){if(!st)st=now;const q=Math.min((now-st)/3500,1);marker.setLatLng([from.lat+(to.lat-from.lat)*q,from.lng+(to.lng-from.lng)*q]);map.panTo(marker.getLatLng());if(q<1)anim=requestAnimationFrame(step);else{map.flyTo(to,18,{duration:1});activate(p)}}anim=requestAnimationFrame(step)}}
window.addEventListener('load',()=>{preloadPoint(pts[0]);preloadPoint(pts[1])});
 function createDualRenderer(){
  const gl=dualcanvas.getContext('webgl',{alpha:true,premultipliedAlpha:false});
  if(!gl)throw new Error('WebGL ei ole käytettävissä');
  const vs='attribute vec2 p; varying vec2 uv; void main(){gl_Position=vec4(p,0.,1.);uv=(p+1.)*.5;}';
  const fs='precision mediump float; varying vec2 uv; uniform sampler2D tex; void main(){vec2 xy=vec2(uv.x*.5,1.-uv.y);vec3 rgb=texture2D(tex,xy).rgb;vec3 mask=texture2D(tex,vec2(xy.x+.5,xy.y)).rgb;float a=dot(mask,vec3(.299,.587,.114));gl_FragColor=vec4(rgb,a);}';
  function shader(type,source){const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh}
  const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.clearColor(0,0,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  return ()=>{if(dualvideo.readyState>=2){gl.clear(gl.COLOR_BUFFER_BIT);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,dualvideo);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}};
 }
 function dualFrame(){if(dualvideo.paused||dualvideo.ended)return;try{dualRenderer();dualRenderId=requestAnimationFrame(dualFrame)}catch(err){console.error('Lara-kaksoiskuvan piirto epäonnistui',err);dualvideo.pause()}}
 function activate(p){
  preloadPoint(pts[idx+1]);t.textContent=p.nimi;d.textContent=p.kuvaus;mt.textContent=p.nimi;md.textContent=p.kuvaus;
  panel.style.display='block';panel.style.opacity=1;setTimeout(()=>{panel.style.opacity=0;setTimeout(()=>panel.style.display='none',1000)},5000);
  box.style.backgroundImage='none';bg.style.display='none';bg.removeAttribute('src');
  if(p.kuva){if(p.kuva.toLowerCase().endsWith('.mp4')){bg.src=p.kuva;bg.style.display='block';bg.play().catch(()=>{})}else box.style.backgroundImage="url('"+p.kuva+"')"}
  modal.style.display='flex';av.style.display='none';av.removeAttribute('src');dualcanvas.style.display='none';
  if(p.dual){
   try{if(!dualRenderer)dualRenderer=createDualRenderer();dualcanvas.style.display='block';dualvideo.src=p.dual;dualvideo.onended=()=>next();dualvideo.onerror=()=>{console.warn('Kaksoiskuva-MP4 ei latautunut');fallback(p)};
    dualvideo.play().then(()=>{dualFrame()}).catch(err=>{console.warn('Kaksoiskuva-MP4 ei käynnistynyt',err);fallback(p)});
   }catch(err){console.error(err);fallback(p)}
  }else if(p.video){av.src=p.video;av.style.display='block';av.play().catch(()=>fallback(p));av.onended=()=>next()}
  else fallback(p);
 }
function fallback(p){if(p.audio){audio.src=p.audio;audio.play().catch(()=>next());audio.onended=()=>next();audio.onerror=()=>next()}else timer=setTimeout(()=>next(),3000)}
function next(){closeModal();if(auto&&idx+1<pts.length){timer=setTimeout(()=>go(idx+1,false),1200)}else if(idx===pts.length-1){const e=document.getElementById('endlink');if(e){modal.style.display='flex';e.style.display='block'}}}
function stopMedia(){if(dualRenderId!==null){cancelAnimationFrame(dualRenderId);dualRenderId=null}dualvideo.pause();dualvideo.removeAttribute('src');dualvideo.onended=null;dualvideo.onerror=null;dualcanvas.style.display='none';audio.pause();audio.removeAttribute('src');av.pause();av.removeAttribute('src');bg.pause();bg.removeAttribute('src');if(timer)clearTimeout(timer)}
function closeModal(){modal.style.display='none';const e=document.getElementById('endlink');if(e)e.style.display='none';stopMedia()}
function stopAll(){auto=false;if(anim)cancelAnimationFrame(anim);closeModal();t.textContent='Esittely pysäytetty';d.textContent='Voit valita kohteen kartalta tai aloittaa uudelleen.'}
</script></body></html>
