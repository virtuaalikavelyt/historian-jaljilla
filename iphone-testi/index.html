<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lara WebP + MP3 testi</title><style>*{box-sizing:border-box}body{margin:0;background:#101110;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{font-size:27px;margin:0 0 8px}p{line-height:1.45;color:#ddd}button{width:100%;padding:15px;border:0;border-radius:12px;font-size:19px;font-weight:750;background:#a77b35;color:#fff;margin:10px 0 16px}.scene{position:relative;width:100%;overflow:hidden;border-radius:18px;background:#222}.bg{display:block;width:100%;height:auto}.lara{position:absolute;left:7%;bottom:0;width:50%;height:auto;pointer-events:none}.status{padding:12px;border-radius:12px;background:#1b1e1b;margin-top:12px;color:#ddd}</style></head><body><main><h1>Lara – iPhone/Android-testi</h1><p>Paina Aloita testi. Laran pitäisi liikkua Putkan kuvan päällä ilman mustaa taustaa ja selostuksen alkaa samalla.</p><button id="start">▶ Aloita testi</button><div class="scene"><img class="bg" src="putka.png" alt="Päävartio"><img id="lara" class="lara" src="lara.webp" alt="Lara"></div><div id="status" class="status">Testi ei ole käynnissä.</div><audio id="audio" preload="auto" src="paavartio.mp3"></audio></main><script>const b=document.getElementById('start'),a=document.getElementById('audio'),s=document.getElementById('status'),l=document.getElementById('lara');function restartWebP(){const src=l.getAttribute('src').split('?')[0];l.src='';requestAnimationFrame(()=>{l.src=src+'?t='+Date.now()})}b.onclick=async()=>{a.pause();a.currentTime=0;restartWebP();try{await a.play();b.textContent='↻ Aloita uudelleen';s.textContent='Testi käynnissä – Lara ja ääni käynnistettiin samalla painalluksella.'}catch(e){s.textContent='Ääni ei käynnistynyt: '+e.message}};a.onended=()=>s.textContent='Testi päättyi.';</script></body></html>
