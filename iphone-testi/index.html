<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone Lara -testi</title>
<style>html,body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:16px}#stage{position:relative;width:100%;aspect-ratio:9/16;max-height:80vh;background:#333;overflow:hidden;border-radius:12px}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lara{position:absolute;left:0;bottom:0;height:70%;max-width:60%;object-fit:contain;z-index:2}.note{line-height:1.45}.btn{padding:12px 18px;border:0;border-radius:9px;font-weight:700;font-size:16px;margin:8px 0}</style></head>
<body><main><h2>iPhone / Safari – Lara-läpinäkyvyystesti</h2><p class="note">Paina Aloita. Katso näkyykö taustavideo normaalisti Laran ympärillä vai tuleeko Laran ympärille musta/harmaa suorakulmio.</p><button class="btn" id="start">▶ Aloita testi</button><div id="stage"><video id="bg" class="bg" src="01-tausta-patsas1.mp4" muted loop playsinline preload="auto"></video><video id="lara" class="lara" src="01-avatar-ratsuvaenpatsas_1080p.webm" playsinline preload="auto"></video></div><p id="status">Valmis testiin.</p></main>
<script>const b=document.getElementById('bg'),l=document.getElementById('lara'),s=document.getElementById('status');document.getElementById('start').onclick=async()=>{s.textContent='Käynnistetään…';try{await b.play()}catch(e){}try{await l.play();s.textContent='Testi käynnissä. Tarkista Laran ympäristö.'}catch(e){s.textContent='Lara ei käynnistynyt: '+e.message}};</script></body></html>
