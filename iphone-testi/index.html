<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lara – WebP-läpinäkyvyystesti</title><style>body{background:#161616;color:white;font-family:system-ui;margin:0;padding:18px}main{max-width:600px;margin:auto}.scene{position:relative;overflow:hidden;border-radius:12px;background:#555;aspect-ratio:9/12}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lara{position:absolute;bottom:0;left:8%;height:90%;max-width:70%;object-fit:contain;object-position:bottom left}button{padding:14px 20px;font-size:17px;border:0;border-radius:10px;background:#c59a4b;color:#111}</style></head><body><main><h2>Laran läpinäkyvyystesti (WebP)</h2><p>Tämä on kolmen sekunnin toistuva animaatio ilman ääntä. Jos Putkan kuva näkyy Laran ympärillä, läpinäkyvyys toimii.</p><div class="scene"><img class="bg" src="putka.png" alt="Putkan taustakuva"><img class="lara" src="lara.webp" alt="Lara liikkuu"></div><p>Jos taustakuvaa ei vielä ole kansiossa, näet harmaan taustan. Mustaa suorakulmiota ei pitäisi näkyä.</p><button onclick="document.querySelector('.lara').src='lara.webp?t='+Date.now()">Aloita animaatio uudelleen</button></main></body></html>
