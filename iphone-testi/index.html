<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lara – 10 sekunnin WebP-testi</title><style>*{box-sizing:border-box}body{margin:0;background:#101110;color:white;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px}p{color:#ddd;line-height:1.5}.scene{position:relative;width:100%;overflow:hidden;border-radius:16px;background:#222}.bg{display:block;width:100%;height:auto}.lara{position:absolute;left:7%;bottom:0;width:40%;height:auto;pointer-events:none}button{width:100%;padding:14px;border:0;border-radius:12px;background:#a77b35;color:#fff;font-size:18px;font-weight:bold;margin:12px 0}</style></head><body><main><h2>Lara – 10 sekunnin WebP-testi</h2><p>Tarkista, että Lara liikkuu luonnollisesti ja tausta on läpinäkyvä. Animaatio toistuu automaattisesti. Tässä kokeessa ei ole ääntä.</p><div class="scene"><img class="bg" src="putka.png" alt="Putkan taustakuva"><img id="lara" class="lara" src="lara.webp" alt="Lara"></div><button id="again">Aloita animaatio alusta</button><script>document.getElementById('again').onclick=()=>{const img=document.getElementById('lara');img.src='lara.webp?t='+Date.now()};</script></main></body></html>
