<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lara – Päävartio koko video -testi</title><style>body{margin:0;background:#14232c;color:white;font-family:Arial,sans-serif;text-align:center}h2{font-size:20px;margin:16px}p{margin:8px 16px;font-size:14px}.stage{position:relative;margin:12px auto;width:min(88vw,330px);aspect-ratio:9/16;background:#9ca9a2 url("putka.png") center/cover no-repeat;border:2px solid white;border-radius:10px;overflow:hidden}canvas{position:relative;width:100%;height:100%;display:block}button{font-size:18px;padding:12px 24px;border:0;border-radius:8px;background:#e8d5a9;color:#17242b}</style></head><body><h2>Lara – Päävartio (43 s)</h2><p>Testataan koko video, ääni ja läpinäkyvyys putka.png-taustalla.</p><div class="stage"><canvas id="canvas" width="540" height="960"></canvas></div><button id="play">▶ Käynnistä testi</button><p id="status">Paina käynnistyspainiketta. Ääni on mukana. Jos putka.png on samassa kansiossa, se näkyy taustalla.</p><video id="vid" src="lara_dual_full.mp4" playsinline webkit-playsinline preload="auto" style="position:absolute;width:2px;height:2px;opacity:0.01;pointer-events:none"></video><script>
const video=document.getElementById('vid'),canvas=document.getElementById('canvas'),status=document.getElementById('status');const gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false});
if(!gl){status.textContent='WebGL ei ole käytettävissä tällä selaimella.'}else{
const vs='attribute vec2 p; varying vec2 uv; void main(){gl_Position=vec4(p,0.,1.);uv=(p+1.)*.5;}';
const fs='precision mediump float; varying vec2 uv; uniform sampler2D tex; void main(){vec2 xy=vec2(uv.x*.5,1.-uv.y);vec3 rgb=texture2D(tex,xy).rgb;vec3 mask=texture2D(tex,vec2(xy.x+.5,xy.y)).rgb;float a=dot(mask,vec3(.299,.587,.114));gl_FragColor=vec4(rgb,a);}' ;
function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh}const prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.clearColor(0,0,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);function render(){if(video.readyState>=2){gl.clear(gl.COLOR_BUFFER_BIT);gl.bindTexture(gl.TEXTURE_2D,tex);try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}catch(e){status.textContent="Videon piirtäminen ei onnistunut: "+e.message;video.pause();return}}if(!video.paused&&!video.ended)requestAnimationFrame(render)}document.getElementById('play').onclick=async()=>{try{video.currentTime=0;await video.play();status.textContent='Testi käynnissä (noin 43 sekuntia).';render()}catch(e){status.textContent='Videon käynnistys epäonnistui: '+e.message}};video.onended=()=>status.textContent='Testi valmis. Käynnistä uudelleen halutessasi.';video.onerror=()=>status.textContent='Videon lataaminen epäonnistui.';
}</script></body></html>
